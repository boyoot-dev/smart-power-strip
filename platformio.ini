[env:esp32dev]
platform = espressif32 @ 7.0.1  ; arduino-esp32 2.0.17 (IDF 4.4): esp_task_wdt_init(30, true) in net.cpp is the IDF 4 API
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
extra_scripts = pre:tools/embed_page.py  ; gzips web/index.html into include/web_page.h
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.0.0
    ESP32Async/AsyncTCP @ ^3.0.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
    https://github.com/boyoot-dev/thingsboard-link.git#640d10a  ; pinned: OTA gate + periodic refresh
